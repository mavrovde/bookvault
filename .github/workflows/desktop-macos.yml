name: Build macOS desktop app

# Build the native macOS .app + .dmg on every release tag (and on demand), and
# attach the .dmg to the GitHub Release. Separate from docker-publish.yml so the
# web/mcp image publish is unaffected. Unsigned dev build; Chromium is fetched on
# first run, so the .dmg stays small.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # upload the .dmg asset to the release
  id-token: write      # OIDC token for build provenance
  attestations: write  # record the signed provenance statement

jobs:
  build:
    name: macOS .dmg
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the desktop app + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ./core -e ./web -e ./desktop pyinstaller

      - name: Build .app + .dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"          # v1.2.3 -> 1.2.3 (blank for manual runs)
          packaging/macos/build.sh "${VERSION:-0.0.0-dev}"

      # Provenance before upload, so an unattested .dmg never reaches a release.
      # The build is unsigned (no Apple Developer ID), so this is what a user
      # has instead of a Gatekeeper signature -- it proves the file came from
      # this repo at this tag, though it does NOT silence Gatekeeper:
      #   gh attestation verify BookVault-<version>.dmg --repo mavrovde/bookvault
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packaging/macos/dist/BookVault-*.dmg

      - name: Attach .dmg to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tolerate the release not existing yet (the tag is pushed before any
          # `gh release create`). All four publish workflows start together, so
          # whichever finishes first has to create it -- macOS is usually the
          # fastest, which is exactly when a bare `upload` fails with
          # "release not found". Matches desktop-linux.yml / desktop-windows.yml.
          gh release create "${GITHUB_REF_NAME}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" packaging/macos/dist/BookVault-*.dmg --clobber

      - name: Upload .dmg as a workflow artifact (also for manual runs)
        uses: actions/upload-artifact@v7
        with:
          name: BookVault-macos-dmg
          path: packaging/macos/dist/BookVault-*.dmg
          if-no-files-found: error
