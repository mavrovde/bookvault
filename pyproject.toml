# Workspace root: dev tooling and shared test/lint configuration for the three
# subprojects (core/, web/, mcp/). Each subproject has its own pyproject.toml
# with its own runtime dependencies -- see the README for the install flow.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookvault-workspace"
version = "1.3.4"
description = "Dev/test tooling for the BookVault monorepo (core + web + mcp)."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.1",
    "pip-audit==2.10.1",
]

[tool.setuptools]
# This root project ships no importable package -- it exists only to carry the
# shared dev tooling and the test/lint config below.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Repo root on the path so `tests.fakes` imports; the three packages come from
# their editable installs (pip install -e ./core ./web ./mcp).
pythonpath = ["."]
# `live` tests (tests/test_smoke_live.py) hit a really-running server + real
# litres.ru, so they can't run offline/in CI. Deselect them by default; run
# them on purpose with `pytest -m live` (a CLI -m overrides this one).
addopts = "-m 'not live and not ui'"
markers = [
    "live: end-to-end smoke test against a running server (opt-in via -m live)",
    # Browser-layer tests. Deselected by default so the ordinary suite stays
    # browser-free (invariants §3) and fast; they still never touch litres.ru
    # -- the app is served against a FakeLitresClient and constructing a real
    # one is an assertion failure. CI runs them in their own job.
    "ui: rendered page + JavaScript, driven through Chromium (opt-in via -m ui)",
]

[tool.coverage.run]
source = ["bookvault_core", "bookvault_web", "bookvault_mcp"]
